controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    swerve_drive_controller:
      type: swerve_drive_controller/SwerveDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_drive_joint"]
    right_wheel_names: ["right_drive_joint"]

    wheel_separation: 1.395
    wheel_radius: 0.15225

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    enable_odom_tf: true   
    enable_odom: true      
    publish_rate: 50.0       
    use_stamped_vel: true     
    cmd_vel_timeout: 0.25     

swerve_drive_controller:
  ros__parameters:
    update_rate: 100

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    cmd_vel_limit:
      # Capability ranges [minimum, maximum] for nonzero body commands.
      # Zero is always allowed so the robot can stop. Yaw limits apply after
      # the controller's angular-command sign inversion.
      # vx_limit: [0.205, 0.48]  # m/s
      # vy_limit: [-0.1, 0.1]  # m/s
      # wz_limit: [-0.86, 0.545]  # rad/s

      vx_limit: [0.1, 0.3]  # m/s
      vy_limit: [-0.1, 0.1]  # m/s
      wz_limit: [-0.9, 0.9]  # rad/s


    steer_joint_names:
      - "front_steer_joint"
      - "left_steer_joint"
      - "right_steer_joint"  

    drive_joint_names:
      - "front_drive_joint"
      - "left_drive_joint"
      - "right_drive_joint"

    state_interface_names:
      - "position"
      - "velocity"
    
    wheel_radius: 0.15225

    # Positions of wheels relative to robot center of mass
    wheel_to_center:
      front: 0.807   # m
      left: 0.8175    # m
      right: 0.8175   # m

    alpha:
      front: 0.0
      left: 0.5236    # 30 degrees in radians
      right: 0.5236   # 30 degrees in radians

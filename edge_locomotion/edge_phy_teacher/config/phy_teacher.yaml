# Physical Teacher settings
/edge/phy_teacher:
  ros__parameters:

    update_rate: 200          # update rate in Hz

    chi: 0.0                  # safety scaling factor
    tau: 20                   # dwelling time in control update (reserved)
    enable: true              # whether to enable the safety controller
    trigger_type: 'event'     # trigger type: 'self' or 'event'

# Gain synthesizer settings
/edge/gain_synthesizer:
  ros__parameters:

    sampling_rate: 35              # sampling rate in Hz
    set_cpu_affinity: 1            # specify which CPU core(s) the node should run on
    print_process_time: false      # whether to print the process time
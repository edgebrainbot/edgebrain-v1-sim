safety_rules:

  # roll limit in degrees
  roll:   
    index: 3
    limit: 0.0
    unit: deg

  # pitch limit in degrees
  pitch:
    index: 4
    limit: 0.0
    unit: deg

  # height limit in meters
  height:
    index: 2
    limit: 0.08
    unit: m

  # velocity limit in meters per second
  vx:
    index: 6
    limit: 0.3
    unit: m/s

  # velocity limit in meters per second
  vy:
    index: 7
    limit: 0.3
    unit: m/s

  # angular velocity limit in radians per second
  wz:
    index: 11
    limit: 0.5
    unit: rad

safety_rules:

  # roll limit in degrees
  roll:   
    index: 3
    limit: 5.0
    unit: deg

  # pitch limit in degrees
  pitch:
    index: 4
    limit: 5.0
    unit: deg

  # height limit in meters
  height:
    index: 2
    limit: 0.08
    unit: m

  # velocity limit in meters per second
  vx:
    index: 6
    limit: 0.2
    unit: m/s

  # velocity limit in meters per second
  vy:
    index: 7
    limit: 0.2
    unit: m/s

  # angular velocity limit in radians per second
  wz:
    index: 11
    limit: 0.2
    unit: rad


  # distance limit to obstacles in meters (reference to local planner)
  obstacle_distance:
    index: -1   # -1 means not used
    limit: 0.2
    unit: m

  # distance limit to goal in meters (reference to global planner)
  goal_distance:
    index: -1   # -1 means not used
    limit: 1.0
    unit: m
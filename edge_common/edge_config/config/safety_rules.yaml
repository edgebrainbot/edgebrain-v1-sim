# =========================================================
# Two types of safety rules:
# 
# type: relative (default) - |error_x| <= limit is SAFE
#    - index: errorState index --> error_x[index]
#    - limit: threshold value
#    - unit: unit for display/conversion
#
# type: absolute - lower < x < upper is SAFE  
#    - index: robotState index --> x[index]
#    - bound: [lower, upper]  # array format
#    - unit: unit for display/conversion
# =========================================================

safety_rules:

  # roll limit in degrees (relative mode: |roll| <= 5 deg)
  roll:   
    type: relative
    index: 3
    limit: 5.0
    unit: deg

  # pitch limit in degrees (relative mode)
  pitch:
    type: relative
    index: 4
    limit: 5.0
    unit: deg

  # height limit in meters (relative mode)
  height:
    type: relative
    index: 2
    limit: 0.06   # (original 0.08)
    unit: m

  # velocity limit in meters per second (relative mode)
  vx:
    type: relative
    index: 6
    limit: 1.3
    unit: m/s

  # velocity limit in meters per second (relative mode)
  vy:
    type: relative
    index: 7
    limit: 1.2
    unit: m/s

  # angular velocity limit in radians per second (relative mode)
  wz:
    type: relative
    index: 11
    limit: 1.2
    unit: rad/s

  # distance limit to obstacles in meters (reference to local planner)
  obstacle_distance:
    type: relative
    index: -1   # -1 means not used for errorState
    limit: 0.2
    unit: m

  # =========================================================
  # EXAMPLE: Absolute bound rules (uncomment to use)
  # =========================================================
  
  # Example: height must be in range (0.25m, 0.45m) to be safe
  # height:
  #   type: absolute
  #   index: 2
  #   bound: [0.25, 0.45]
  #   unit: m

  # Example: x position must be in range (0.3, 0.7) to be safe
  # px:
  #   type: absolute
  #   index: 0
  #   bound: [0.3, 0.7]
  #   unit: m